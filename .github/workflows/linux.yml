# Linux checks: the headless harness and the whole runtime (SDL3 window and sound, Vulkan renderer, ImGui) around a
# stub image (tests/linux), no game code or files needed; the launcher service and its Linux tools (sdk/launcher)
name: linux

on:
  push:
    branches: [linux-port]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build pkg-config libvulkan-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libdecor-0-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev
          clang++ --version
          cmake --version

      - name: Harness (headless)
        env:
          CXX: clang++
        run: bash tests/linux/harness.sh "$RUNNER_TEMP/harness"

      - name: Configure runtime check
        if: ${{ !cancelled() }}
        run: |
          cmake -S tests/linux -B "$RUNNER_TEMP/rt" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++             -DCMAKE_C_FLAGS=-march=x86-64-v2 -DCMAKE_CXX_FLAGS=-march=x86-64-v2

      - name: Build runtime check
        if: ${{ !cancelled() }}
        run: cmake --build "$RUNNER_TEMP/rt" -- -k 0

      - name: Result
        run: ls -la "$RUNNER_TEMP/rt"

  # the launcher service and launcher_cli on Linux (sdk/launcher), around the game template's launcher folder: they
  # build, the service answers, and launcher_cli fetches and unpacks the small Linux tools of toolchain.json (Ninja's
  # zip, CMake's tar.gz) runnable
  launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build

      - name: Build
        run: |
          cmake -S launcher -B "$RUNNER_TEMP/launcher" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ -DLAUNCHER_GAME="$PWD/templates/game/launcher"
          cmake --build "$RUNNER_TEMP/launcher"

      - name: Service answers
        run: |
          mkdir -p "$RUNNER_TEMP/games"
          printf '{"cmd":"state"}\n{"cmd":"quit"}\n' | "$RUNNER_TEMP/launcher/GameLauncherService" \
            --games "$RUNNER_TEMP/games" --root "$RUNNER_TEMP/games/Game" | tee "$RUNNER_TEMP/state.txt"
          grep -q '"os":"linux"' "$RUNNER_TEMP/state.txt"
          grep -q '"agreed":true' "$RUNNER_TEMP/state.txt"

      - name: Linux tools fetched and unpacked
        run: |
          cli="$RUNNER_TEMP/launcher/launcher_cli"
          game=templates/game/launcher/game.json
          "$cli" "$game" "$RUNNER_TEMP/lt" plan
          "$cli" "$game" "$RUNNER_TEMP/lt" tool ninja
          "$cli" "$game" "$RUNNER_TEMP/lt" tool cmake
          "$RUNNER_TEMP/lt/tools/ninja/ninja" --version
          "$RUNNER_TEMP/lt/tools/cmake/bin/cmake" --version
