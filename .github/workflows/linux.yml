# Linux compile check: the headless harness and the whole runtime (SDL3 window and sound, Vulkan renderer, ImGui)
# around a stub image (tests/linux), no game code or files needed
name: linux

on:
  push:
    branches: [linux-port]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build pkg-config libvulkan-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libdecor-0-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev
          clang++ --version
          cmake --version

      - name: Harness (headless)
        env:
          CXX: clang++
        run: bash tests/linux/harness.sh "$RUNNER_TEMP/harness"

      - name: Configure runtime check
        if: ${{ !cancelled() }}
        run: |
          cmake -S tests/linux -B "$RUNNER_TEMP/rt" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build runtime check
        if: ${{ !cancelled() }}
        run: cmake --build "$RUNNER_TEMP/rt" -- -k 0

      - name: Result
        run: ls -la "$RUNNER_TEMP/rt"
